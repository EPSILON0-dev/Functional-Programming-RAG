services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${DB_USERNAME:-pf_rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pf_rag_password}
      POSTGRES_DB: ${DB_NAME:-pf_rag_db}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pf_rag_user} -d ${DB_NAME:-pf_rag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      MIX_ENV: ${MIX_ENV:-prod}
      DB_USERNAME: ${DB_USERNAME:-pf_rag_user}
      DB_PASSWORD: ${DB_PASSWORD:-pf_rag_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pf_rag_db}
      DATABASE_URL: ecto://${DB_USERNAME:-pf_rag_user}:${DB_PASSWORD:-pf_rag_password}@${DB_HOST:-db}/${DB_NAME:-pf_rag_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      PORT: ${PORT:-4000}
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_32_chars_long}
      JOKEN_SIGNER: ${JOKEN_SIGNER:-super_secret_key_for_dev_only_change_in_prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PGPASSWORD: ${DB_PASSWORD:-pf_rag_password}
    volumes:
      - ./db/import:/import:ro
    networks:
      - internal
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    ports:
      - "80:80"
    networks:
      - frontend
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: true
  frontend:
    driver: bridge
