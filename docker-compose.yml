services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${DB_USER:-pf_rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pf_rag_password}
      POSTGRES_DB: ${DB_NAME:-pf_rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pf_rag_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL: ecto://${DB_USER:-pf_rag_user}:${DB_PASSWORD:-pf_rag_password}@db/${DB_NAME:-pf_rag_db}
      PORT: 4000
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - pf-rag-network
  #   command: ["bin/api", "eval", "Api.Release.oban_start"]

networks:
  pf-rag-network:
    driver: bridge
